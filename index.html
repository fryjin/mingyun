<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090910"><link rel="manifest" href="manifest.json"><link rel="preload" as="style" href="#app-style"><title>今晚谁遭殃</title><style id="app-style">
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:#f8f7ff;background:#090910}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}.app{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 20% 0%,#21183b 0,transparent 38%),linear-gradient(180deg,#0d0c16,#08080d)}.ambient{position:fixed;border-radius:50%;filter:blur(90px);opacity:.22}.a1{width:260px;height:260px;background:#7c5cff;top:-90px;right:-80px}.a2{width:220px;height:220px;background:#ff5d8f;bottom:-90px;left:-100px}.top{height:68px;padding:16px 18px;display:flex;justify-content:space-between;position:relative;z-index:5}.icon{width:42px;height:42px;border:1px solid #ffffff17;background:#ffffff0d;color:#fff;border-radius:14px;font-size:20px}.screen{width:min(100%,520px);margin:auto;padding:22px 22px 42px;position:relative;z-index:2}.home{padding-top:45px}.brand,.eyebrow{color:#b8a9ff;font-size:12px;font-weight:800;letter-spacing:.14em}.home h1{font-size:56px;line-height:1.05;margin:20px 0 16px;letter-spacing:-.05em}.home h1 span{background:linear-gradient(100deg,#fff,#aa91ff 55%,#ff9bba);-webkit-background-clip:text;color:transparent}.lead,.setup>p{color:#a6a3b3;line-height:1.65;margin:0 0 32px}.mode-grid{display:grid;gap:14px}.mode-card{border:1px solid #ffffff17;border-radius:24px;padding:22px 18px;color:#fff;text-align:left;display:grid;grid-template-columns:58px 1fr auto;gap:16px;align-items:center;background:#ffffff0b}.mode-card:active{transform:scale(.985)}.mode-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px}.dice-card .mode-icon{background:linear-gradient(145deg,#8b6bff,#5a3ee8)}.wheel-card .mode-icon{background:linear-gradient(145deg,#ff7a8d,#e83e6f)}.mode-card small{color:#9692a5}.mode-card h2{font-size:21px;margin:3px 0 4px}.mode-card p{font-size:13px;color:#aaa6b6;margin:0}.note{text-align:center;color:#615e6c;font-size:11px;margin-top:28px}.setup{padding-top:32px}.setup h1{font-size:38px;margin:12px 0 8px}.card{margin-top:18px;border:1px solid #ffffff17;background:#ffffff0b;border-radius:24px;padding:20px}.card-title{font-weight:800}.counter{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;margin:22px 0}.counter strong{text-align:center;font-size:52px}.counter button{height:48px;border-radius:15px;border:1px solid #ffffff1a;background:#1b1927;color:#fff;font-size:23px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button,.seg button{border:0;background:#1b1927;color:#9c98a9;border-radius:12px;padding:10px 13px}.quick .active,.seg .active{color:#fff;background:#6f54f5}.seg{display:grid;grid-template-columns:1fr 1fr;background:#12111a;border-radius:15px;padding:4px;margin-top:15px}.seg button{padding:13px}.primary{width:100%;height:56px;border:0;border-radius:18px;margin-top:22px;background:linear-gradient(100deg,#7559f5,#9b6fff);color:#fff;font-weight:800;font-size:16px}.heading{display:flex;justify-content:space-between;align-items:end}.heading span{font-size:11px;letter-spacing:.15em;color:#8f83c8}.heading h1{font-size:30px;margin:4px 0 0}.pill{padding:8px 12px;background:#ffffff0f;border:1px solid #ffffff14;border-radius:999px;color:#c4c0d0;font-size:12px}.turn{text-align:center;padding:28px 0 20px}.turn p{color:#bbb6c9}.die{width:146px;height:146px;margin:12px auto 22px;border-radius:32px;background:linear-gradient(145deg,#fff,#d9d4ee);color:#15131e;display:grid;place-items:center;font-size:72px;font-weight:800;box-shadow:0 24px 60px #684de540}.rolling{animation:shake .2s infinite}.roll{height:50px;padding:0 34px;border:0;border-radius:16px;background:#7658f5;color:#fff;font-size:16px;font-weight:700}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score{background:#ffffff0b;border:1px solid #ffffff0f;border-radius:14px;padding:11px 8px;text-align:center}.score span{display:block;font-size:11px;color:#918d9d}.score strong{font-size:20px}.score.current{border-color:#8b70ff;background:#7758f51f}.wheel-wrap{position:relative;width:min(86vw,360px);aspect-ratio:1;margin:40px auto 24px}.pointer{position:absolute;z-index:4;left:50%;top:-18px;transform:translateX(-50%);font-size:34px}.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #20202b;position:relative;transition:transform 3.8s cubic-bezier(.12,.65,.12,1);box-shadow:0 28px 65px #0007}.wheel span{position:absolute;left:calc(50% - 10px);top:50%;width:20px;height:50%;transform-origin:50% 0;color:#fff;font-weight:800;text-align:center;padding-top:18px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#14131d;border:8px solid #f7f4ff;display:grid;place-items:center;font-size:28px}.overlay{position:fixed;inset:0;z-index:20;background:#06060ab8;backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;padding:16px}.result{width:min(100%,500px);background:#15141f;border:1px solid #ffffff1a;border-radius:28px;padding:30px 24px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .35s ease}.result-label{font-size:12px;color:#9994a6;letter-spacing:.12em}.result h2{font-size:34px;margin:8px 0 20px}.ptype{display:inline-block;padding:7px 13px;background:#6953f12e;color:#ae9cff;border-radius:999px;font-weight:800}.ptype.dare{background:#ff528229;color:#ff8aaa}.result p{font-size:20px;line-height:1.55;margin:20px 0 26px}.actions{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}.actions button{height:50px;border:1px solid #ffffff1a;background:#22212c;color:#fff;border-radius:15px;font-weight:700}.actions .again{border:0;background:#7658f5}@keyframes shake{50%{transform:rotate(3deg) scale(1.02)}}@keyframes up{from{transform:translateY(30px);opacity:0}}@media(min-width:700px){.home{padding-top:80px}.scores{grid-template-columns:repeat(6,1fr)}}

/* UX upgrade layer */
button{cursor:pointer;-webkit-tap-highlight-color:transparent} .mode-card,.card,.score,.result{backdrop-filter:blur(16px)} .mode-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.mode-card:hover{transform:translateY(-3px);border-color:#8f79ff55;box-shadow:0 18px 40px #0004}.die{transition:transform .12s ease}.rolling{animation:shake .12s infinite}.primary,.roll{transition:transform .15s ease,filter .15s ease}.primary:active,.roll:active{transform:scale(.97)} .result{animation:up .35s cubic-bezier(.2,.8,.2,1)}
</style></head><body><main class="app"><div class="ambient a1"></div><div class="ambient a2"></div><header class="top"><button id="back" class="icon" style="visibility:hidden">←</button><button id="sound" class="icon">♪</button></header><section id="view" class="screen"></section></main><script>
const truths=[
'现场谁最符合你的理想型？','最近一次心动是什么时候？','你做过最幼稚的一件事是什么？','手机里最舍不得删除的照片是什么？','如果重新选择一次职业，你会选什么？','说一个别人不知道的小秘密。','现场谁给你的第一印象最好？为什么？','你最后悔的一次决定是什么？','你最害怕别人知道什么？','你认为自己的最大优点是什么？','你认为自己的最大缺点是什么？','最近一次偷偷开心的事情是什么？','你曾经暗恋过谁？','你人生中最尴尬的一刻是什么？','如果明天中了大奖，你第一件事做什么？','你最想感谢的人是谁？','你觉得自己最像哪种动物？为什么？','你有没有假装不在乎但其实很在意的事情？','现场谁最适合当你的搭档？','你最近一次流泪是什么原因？','你觉得爱情里最重要的是什么？','你做过最勇敢的一件事是什么？','你最想改变自己哪个习惯？','你认为朋友最重要的品质是什么？','如果可以回到过去，你想改变哪一年？'
];
const dares=[
'模仿现场一位玩家直到有人猜中。','用夸张语气朗读最近收到的一条消息。','和指定玩家深情对视20秒。','用三种不同声音介绍自己。','随机选择玩家，让对方评价你的三个优点。','即兴跳舞15秒。','用方言说一句土味情话。','模仿一个明星直到大家猜出来。','闭眼转三圈后完成指定动作。','现场讲一个冷笑话，直到有人笑。','给通讯录最近一个联系人发送一个表情包。','用播音员语气介绍现场所有人。','做20个深蹲并喊玩家名字。','演一段偶像剧告白。','让其他玩家设计你的下一句朋友圈文案。','唱一首歌的副歌部分。','用三个表情演绎一段剧情。','模仿动物30秒。','让现场玩家给你打一个1-10分。','用左手写自己的名字。','随机夸奖三位玩家。','摆一个最夸张的自拍姿势10秒。','一分钟内不能说“我”。','复述一段绕口令。','现场表演一个广告代言。'
];
let state={mode:'home',count:4,rule:'max',players:[],turn:0,die:1,rotation:0,loser:null,pun:null,busy:false};const view=document.querySelector('#view'),back=document.querySelector('#back');
function punishment(){const type=Math.random()>.5?'真心话':'大冒险',arr=type==='真心话'?truths:dares;return{type,text:arr[Math.floor(Math.random()*arr.length)]}}
function render(){back.style.visibility=state.mode==='home'?'hidden':'visible';if(state.mode==='home')view.innerHTML=`<div class="home"><div class="brand">✦ PARTY LAB</div><h1>今晚，<br><span>谁遭殃？</span></h1><p class="lead">两种玩法，一次决定。适合聚会、酒局与破冰场景。</p><div class="mode-grid"><button class="mode-card dice-card" onclick="goSetup('dice')"><div class="mode-icon">⚄</div><div><small>轮流比点数</small><h2>命运骰局</h2><p>最大或最小点数接受惩罚</p></div><b>›</b></button><button class="mode-card wheel-card" onclick="goSetup('wheel')"><div class="mode-icon">↻</div><div><small>随机锁定玩家</small><h2>俄罗斯转盘</h2><p>指针停在谁，谁接受惩罚</p></div><b>›</b></button></div><p class="note">请理性娱乐，惩罚内容以安全、自愿为前提</p></div>`;else if(state.mode.endsWith('setup')){const dice=state.mode==='dice-setup';view.innerHTML=`<div class="setup"><div class="eyebrow">GAME SETUP</div><h1>${dice?'命运骰局':'俄罗斯转盘'}</h1><p>先确定本轮参与人数，再开始游戏。</p><div class="card"><div class="card-title">♙ 参与人数</div><div class="counter"><button onclick="count(-1)">−</button><strong>${state.count}</strong><button onclick="count(1)">＋</button></div><div class="quick">${[2,3,4,5,6,8].map(n=>`<button class="${state.count===n?'active':''}" onclick="setCount(${n})">${n}人</button>`).join('')}</div></div>${dice?`<div class="card"><div class="card-title">输家判定</div><div class="seg"><button class="${state.rule==='max'?'active':''}" onclick="setRule('max')">点数最大</button><button class="${state.rule==='min'?'active':''}" onclick="setRule('min')">点数最小</button></div></div>`:''}<button class="primary" onclick="start('${dice?'dice':'wheel'}')">开始游戏　›</button></div>`}else if(state.mode==='dice-game')renderDice();else renderWheel()}
function goSetup(t){state.mode=t+'-setup';render()}function count(d){state.count=Math.max(2,Math.min(12,state.count+d));render()}function setCount(n){state.count=n;render()}function setRule(r){state.rule=r;render()}function start(t){state.players=Array.from({length:state.count},(_,i)=>({id:i+1,name:'玩家 '+(i+1)}));state.turn=0;state.loser=null;state.pun=null;state.mode=t+'-game';render()}
function renderDice(){view.innerHTML=`<div class="heading"><div><span>ROUND 01</span><h1>命运骰局</h1></div><div class="pill">${state.rule==='max'?'最大点数输':'最小点数输'}</div></div><div class="turn"><p>${state.loser?'本轮结果':'轮到 '+state.players[state.turn].name}</p><div class="die ${state.busy?'rolling':''}">${state.die}</div>${state.loser?'':`<button class="roll" onclick="roll()" ${state.busy?'disabled':''}>${state.busy?'投掷中…':'投骰子'}</button>`}</div><div class="scores">${state.players.map((p,i)=>`<div class="score ${i===state.turn&&!state.loser?'current':''}"><span>${p.name}</span><strong>${p.score??'—'}</strong></div>`).join('')}</div>${state.loser?resultHTML():''}`}
function roll(){if(state.busy)return;state.busy=true;render();let t=0;const id=setInterval(()=>{state.die=1+Math.floor(Math.random()*6);document.querySelector('.die').textContent=state.die;if(++t>=10){clearInterval(id);const score=1+Math.floor(Math.random()*6);state.die=score;state.players[state.turn].score=score;state.busy=false;if(state.turn===state.players.length-1){const vals=state.players.map(p=>p.score),target=state.rule==='max'?Math.max(...vals):Math.min(...vals),c=state.players.filter(p=>p.score===target);state.loser=c[Math.floor(Math.random()*c.length)];state.pun=punishment()}else state.turn++;render()}},75)}
function renderWheel(){const colors=['#ff6b6b','#7c5cff','#24c8a5','#ffb547','#5aa7ff','#f06dd7','#97d84b','#ff8d5c'],step=360/state.players.length,bg=`conic-gradient(${state.players.map((_,i)=>`${colors[i%colors.length]} ${i*step}deg ${(i+1)*step}deg`).join(',')})`;view.innerHTML=`<div class="heading"><div><span>LUCKY WHEEL</span><h1>俄罗斯转盘</h1></div><div class="pill">${state.players.length} 位玩家</div></div><div class="wheel-wrap"><div class="pointer">▼</div><div class="wheel" style="background:${bg};transform:rotate(${state.rotation}deg)">${state.players.map((p,i)=>`<span style="transform:rotate(${i*step+step/2}deg) translateY(-42%)">${p.id}</span>`).join('')}<div class="center">↻</div></div></div>${state.loser?'':`<button class="primary" onclick="spin()" ${state.busy?'disabled':''}>${state.busy?'命运转动中…':'转动转盘'}</button>`}${state.loser?resultHTML():''}`}
function spin(){if(state.busy)return;state.busy=true;state.loser=null;state.pun=null;const idx=Math.floor(Math.random()*state.players.length),step=360/state.players.length,target=idx*step+step/2;state.rotation+= (5+Math.floor(Math.random()*3))*360+(360-target);render();setTimeout(()=>{state.loser=state.players[idx];state.pun=punishment();state.busy=false;render()},3800)}
function resultHTML(){return `<div class="overlay"><div class="result"><div class="result-label">命运选中了</div><h2>${state.loser.name}</h2><div class="ptype ${state.pun.type==='大冒险'?'dare':''}">${state.pun.type}</div><p>${state.pun.text}</p><div class="actions"><button onclick="refreshPun()">换一个惩罚</button><button class="again" onclick="again()">再来一轮</button></div></div></div>`}function refreshPun(){state.pun=punishment();render()}function again(){if(state.mode==='dice-game'){state.players.forEach(p=>delete p.score);state.turn=0}else state.loser=null;state.pun=null;render()}back.onclick=()=>{state={...state,mode:'home',players:[],loser:null,pun:null,turn:0,rotation:0};render()};if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}
render();
</script></body></html>
