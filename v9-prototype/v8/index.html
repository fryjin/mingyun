<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0911">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="适合朋友聚会的骰子与俄罗斯转盘真心话大冒险游戏。">
  <title>今晚谁遭殃 · Party Game</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="preload" href="./app.css" as="style">
  <link rel="preload" href="./app.js" as="script">
  <link rel="stylesheet" href="./app.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <header class="app-header">
      <button id="backButton" class="icon-button back-button" type="button" aria-label="返回" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="header-brand" aria-label="Party Lab">
        <span class="brand-dot"></span>
        <span>PARTY LAB</span>
      </div>
      <div class="header-actions">
        <span id="networkBadge" class="network-badge" aria-live="polite">在线</span>
        <button id="installButton" class="icon-button" type="button" aria-label="安装到设备" title="安装到设备" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </button>
        <button id="soundButton" class="icon-button" type="button" aria-label="关闭音效与触感" title="音效与触感">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Zm4.5 4.2a4 4 0 0 1 0 5.6M18 6.5a8 8 0 0 1 0 11"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Zm5 5 5 5m0-5-5 5"/></svg>
        </button>
      </div>
    </header>

    <section id="view" class="screen" aria-live="off"></section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="liveRegion" class="sr-only" aria-live="assertive"></div>
  </main>
  <noscript>需要开启 JavaScript 才能运行本游戏。</noscript>
</body>
</html>
